<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 650 50'
    style='background-color: #00000000;'
    width='650px' height='50px'>

    <style>
@font-face {
  font-family: 'Montserrat';
  font-style: normal;
  font-weight: 700;
  font-display: fallback;
  src: local('Montserrat-Bold'), local('Montserrat Bold'), local('Segoe UI Bold'), local('Roboto-Bold'), sans-serif;
}
    </style>

    <path id='path0'>
        <animate id='d0' attributeName='d' begin='0s;d4.end'
            dur='5000ms' fill='remove'
            values='m0,25 h0 ; m0,25 h650 ; m0,25 h650 ; m0,25 h0' keyTimes='0;0.6;0.85;1' />
    </path>
    <text font-family='"Montserrat", -apple-system, sans-serif' font-weight='700' fill='#F52271' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path0'>
            Crafting Production-Grade Full-Stack Apps
        </textPath>
    </text>

    <path id='path1'>
        <animate id='d1' attributeName='d' begin='d0.end'
            dur='5000ms' fill='remove'
            values='m0,25 h0 ; m0,25 h650 ; m0,25 h650 ; m0,25 h0' keyTimes='0;0.6;0.85;1' />
    </path>
    <text font-family='"Montserrat", -apple-system, sans-serif' font-weight='700' fill='#F52271' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path1'>
            React.js • TypeScript • Node.js Specialist
        </textPath>
    </text>

    <path id='path2'>
        <animate id='d2' attributeName='d' begin='d1.end'
            dur='5000ms' fill='remove'
            values='m0,25 h0 ; m0,25 h650 ; m0,25 h650 ; m0,25 h0' keyTimes='0;0.6;0.85;1' />
    </path>
    <text font-family='"Montserrat", -apple-system, sans-serif' font-weight='700' fill='#F52271' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path2'>
            Creator of ClientPilot AI &amp; BiteDash
        </textPath>
    </text>

    <path id='path3'>
        <animate id='d3' attributeName='d' begin='d2.end'
            dur='5000ms' fill='remove'
            values='m0,25 h0 ; m0,25 h650 ; m0,25 h650 ; m0,25 h0' keyTimes='0;0.6;0.85;1' />
    </path>
    <text font-family='"Montserrat", -apple-system, sans-serif' font-weight='700' fill='#F52271' font-size='22'
